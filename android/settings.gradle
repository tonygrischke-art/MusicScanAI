pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
    def rnPluginPath = new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().toString()
    println "Including RN gradle plugin from: " + rnPluginPath
    includeBuild(rnPluginPath)
    
    def expoCorePkg = ["node", "--print", "require.resolve('expo-modules-core/package.json')"].execute(null, rootDir).text.trim()
    def expoCorePath = new File(new File(expoCorePkg).getParentFile(), "android")
    println "Including expo-modules-core from: " + expoCorePath
    includeBuild(expoCorePath)
    
    def expoAutolinkingPkg = ["node", "--print", "require.resolve('expo-modules-autolinking/package.json')"].execute(null, rootDir).text.trim()
    def expoAutolinkingPath = new File(new File(expoAutolinkingPkg).getParentFile(), "android/expo-gradle-plugin")
    println "Including expo-modules-autolinking from: " + expoAutolinkingPath
    includeBuild(expoAutolinkingPath)
}

plugins { 
    id("com.facebook.react.settings")
}

if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') != '1') {
    plugins {
        id("expo-autolinking-settings")
    }
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    def command = [
      'node',
      '--no-warnings',
      '--eval',
      'require(require.resolve(\'expo-modules-autolinking\', { paths: [require.resolve(\'expo/package.json\')] }))(process.argv.slice(1))',
      'react-native-config',
      '--json',
      '--platform',
      'android'
    ].toList()
    ex.autolinkLibrariesFromCommand(command)
  }
}

rootProject.name = 'MusicScan AI'

dependencyResolutionManagement {
  versionCatalogs {
    reactAndroidLibs {
      from(files(new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), "../gradle/libs.versions.toml")))
    }
  }
}

include ':app'
includeBuild(new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile())
