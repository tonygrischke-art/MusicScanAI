name: Build MusicScanAI Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Verify Android SDK (pre-installed on ubuntu-latest)
      run: |
        echo "ANDROID_HOME: $ANDROID_HOME"
        ls -la $ANDROID_HOME/
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list | head -20

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Prebuild Android
      run: npx expo prebuild --platform android --no-install

    - name: Configure Gradle
      run: |
        cat > android/gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
        org.gradle.parallel=true
        org.gradle.configureondemand=true
        android.useAndroidX=true
        android.enableJetifier=true
        kotlin.code.style=official
        EOF

    - name: Patch all expo modules to use ExpoModulesCorePlugin
      run: |
        # Find all expo module build.gradle files that use expo-module-gradle-plugin
        for f in node_modules/expo-*/android/build.gradle node_modules/@expo/*/android/build.gradle; do
          if [ -f "$f" ] && grep -q "expo-module-gradle-plugin" "$f"; then
            echo "Patching $f"
            # Remove the plugin id line
            sed -i "/id 'expo-module-gradle-plugin'/d" "$f"
            sed -i '/id "expo-module-gradle-plugin"/d' "$f"
            # Add apply from ExpoModulesCorePlugin.gradle AFTER plugins block
            # Find the line with closing brace of plugins block and insert after it
            sed -i '/^plugins {/,/^}/ { /^}/a\apply from: "${project.rootDir}\/..\/node_modules\/expo-modules-core\/android\/ExpoModulesCorePlugin.gradle"' "$f"
            # Add compileSdkVersion if missing
            if ! grep -q "compileSdkVersion" "$f"; then
              sed -i '/^android {/a\    compileSdkVersion 34' "$f"
            fi
          fi
        done
        echo "Patched all expo modules"

    - name: Fix ExpoModulesCorePlugin.gradle components.release issue
      run: |
        PLUGIN_FILE="node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle"
        if [ -f "$PLUGIN_FILE" ]; then
          # Fix the components.release reference
          sed -i 's/from components\.release/from (components.findByName("release") ?: components.findByName("main") ?: components.findByName("android") ?: components.findByName("aar"))/g' "$PLUGIN_FILE"
          echo "Fixed $PLUGIN_FILE"
        else
          echo "Warning: $PLUGIN_FILE not found"
        fi

    - name: Patch app build.gradle for hermesenabled property
      run: |
        APP_GRADLE="android/app/build.gradle"
        if [ -f "$APP_GRADLE" ]; then
          sed -i "/def useHermes = project.hasProperty('hermesEnabled')/d" "$APP_GRADLE"
          sed -i "/def useHermes = project.hasProperty('hermesenabled')/d" "$APP_GRADLE"
          sed -i '/dependencies {/a\    def useHermes = project.hasProperty('\''hermesenabled'\'') ? project.property('\''hermesenabled'\'').toBoolean() : false' "$APP_GRADLE"
          sed -i 's/\bhermesEnabled\b/useHermes/g' "$APP_GRADLE"
          echo "Patched $APP_GRADLE"
        else
          echo "Warning: $APP_GRADLE not found"
        fi

    - name: Grant gradlew execute permission
      run: chmod +x android/gradlew

    - name: Build Android
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon -Phermesenabled=false -Dorg.gradle.workers.max=2 --info 2>&1 | tee build_output.txt; exit ${PIPESTATUS[0]}

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: MusicScanAI-Debug
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: android/build_output.txt
        retention-days: 7
