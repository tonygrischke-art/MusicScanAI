name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Typecheck
      run: npx tsc --noEmit

    - name: Lint
      run: npm run lint --if-present

  jest:
    name: Jest Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Run Jest tests
      run: npx jest --passWithNoTests --forceExit --coverage

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jest-coverage
        path: coverage/
        retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [lint-typecheck, jest]
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Verify Android SDK (pre-installed on ubuntu-latest)
      run: |
        echo "ANDROID_HOME: $ANDROID_HOME"
        ls -la $ANDROID_HOME/
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list | head -20

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Expo prebuild
      run: npx expo prebuild --platform android --no-install

    - name: Patch app/build.gradle for Hermes/JSC
      run: |
        cd android/app
        # Remove any existing hermesEnabled references
        sed -i '/hermesEnabled/d' build.gradle
        # Add hermes/jsc dependency configuration after android block using Python
        python3 << 'PYEOF'
with open('build.gradle', 'r') as f:
    content = f.read()

# Find the closing brace of android block and add afterEvaluate after it
import re
pattern = r'(^})'
replacement = r'''\1

// Configure Hermes/JSC dependency after project evaluation
afterEvaluate {
    def useHermes = project.hasProperty('expo.jsEngine') ? project.property('expo.jsEngine') == "hermes" : true
    if (useHermes) {
        dependencies {
            implementation("com.facebook.react:hermes-android")
        }
    } else {
        dependencies {
            implementation jscFlavor
        }
    }
}'''

new_content = re.sub(pattern, replacement, content, count=1, flags=re.MULTILINE)

with open('build.gradle', 'w') as f:
    f.write(new_content)
print("Patched build.gradle successfully")
PYEOF

    - name: Grant gradlew execute permission
      run: chmod +x android/gradlew

    - name: Build debug APK
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon
      env:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MusicScanAI-Debug
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 30