name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npx tsc --noEmit

    - name: Lint
      run: npm run lint

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: lint-typecheck
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Verify Android SDK (pre-installed on ubuntu-latest)
      run: |
        echo "ANDROID_HOME: $ANDROID_HOME"
        ls -la $ANDROID_HOME/
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list | head -20

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Expo prebuild
      run: npx expo prebuild --platform android --no-install --clean

    - name: Patch expo-application build.gradle for expo-module-gradle-plugin
      run: |
        EXPO_APP_GRADLE="node_modules/expo-application/android/build.gradle"
        if [ -f "$EXPO_APP_GRADLE" ]; then
          sed -i "s/id 'expo-module-gradle-plugin'/apply from: '\${project.rootDir}\/node_modules\/expo-modules-core\/android\/ExpoModulesCorePlugin.gradle'/" "$EXPO_APP_GRADLE"
          echo "Patched $EXPO_APP_GRADLE"
        else
          echo "Warning: $EXPO_APP_GRADLE not found"
        fi

    - name: Disable Hermes in gradle.properties
      run: sed -i 's/hermesEnabled=true/hermesEnabled=false/' android/gradle.properties

    - name: Grant gradlew execute permission
      run: chmod +x android/gradlew

    - name: Build debug APK
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon
      env:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MusicScanAI-Debug
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 30